name: Release Readiness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: No tracked build / compiler output
        run: node scripts/check_tracked_generated_artifacts.js

  email-limits-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check email monthly limits (Dart vs Functions)
        run: node scripts/check_email_monthly_limits_parity.js

  marketing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketing/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check:release
      - run: npm run build

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            functions-shared/package-lock.json
      # functions/vendor/functions-shared is gitignored; fresh clones need a built copy for file: deps.
      - name: Build functions-shared and vendor into function packages
        working-directory: ${{ github.workspace }}
        run: |
          npm ci --prefix functions-shared
          node scripts/vendor-functions-shared.cjs
      - run: npm ci
      - run: npm run build
      - run: npm run check:quickbooks
      - run: npm test

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          cache: true
      - run: flutter pub get
      - name: Flutter analyze (non-blocking legacy backlog visibility)
        run: flutter analyze
        continue-on-error: true
      - run: flutter test
