name: Release Readiness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: No tracked build / compiler output
        run: node scripts/check_tracked_generated_artifacts.js
      - name: firestore.rules matches firestore-rules-src/
        run: node scripts/build_firestore_rules.cjs --check

  email-limits-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check email monthly limits (Dart vs Functions)
        run: node scripts/check_email_monthly_limits_parity.js

  marketing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketing/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check:release
      - run: npm run build

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            functions-shared/package-lock.json
      # functions/vendor/functions-shared is gitignored; fresh clones need a built copy for file: deps.
      - name: Build functions-shared and vendor into function packages
        working-directory: ${{ github.workspace }}
        run: |
          npm ci --prefix functions-shared
          node scripts/vendor-functions-shared.cjs
      - run: npm ci
      - run: npm run build
      - run: npm run check:quickbooks
      - run: npm test

  functions-integrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions-integrations
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            functions-integrations/package-lock.json
            functions-shared/package-lock.json
      - name: Build functions-shared and vendor into function packages
        working-directory: ${{ github.workspace }}
        run: |
          npm ci --prefix functions-shared
          node scripts/vendor-functions-shared.cjs
      - run: npm ci
      - run: npm test

  functions-automation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions-automation
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            functions-automation/package-lock.json
            functions-shared/package-lock.json
      - name: Build functions-shared and vendor into function packages
        working-directory: ${{ github.workspace }}
        run: |
          npm ci --prefix functions-shared
          node scripts/vendor-functions-shared.cjs
      - run: npm ci
      - run: npm test

  functions-ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions-ai
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            functions-ai/package-lock.json
            functions-shared/package-lock.json
      - name: Build functions-shared and vendor into function packages
        working-directory: ${{ github.workspace }}
        run: |
          npm ci --prefix functions-shared
          node scripts/vendor-functions-shared.cjs
      - run: npm ci
      - run: npm test

  functions-facility-ops:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions-facility-ops
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            functions-facility-ops/package-lock.json
            functions-shared/package-lock.json
      - name: Build functions-shared and vendor into function packages
        working-directory: ${{ github.workspace }}
        run: |
          npm ci --prefix functions-shared
          node scripts/vendor-functions-shared.cjs
      - run: npm ci
      - run: npm test

  functions-account-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions-account-security
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            functions-account-security/package-lock.json
            functions-shared/package-lock.json
      - name: Build functions-shared and vendor into function packages
        working-directory: ${{ github.workspace }}
        run: |
          npm ci --prefix functions-shared
          node scripts/vendor-functions-shared.cjs
      - run: npm ci
      - run: npm test

  # Remaining function packages. These had no CI job at all — they were not even
  # compiled on push, so a type error could reach production unnoticed. A matrix
  # keeps them covered without six near-identical jobs; `npm test --if-present`
  # runs tests for the packages that have them and no-ops for the rest.
  functions-remaining:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - functions-admin
          - functions-marketing
          - functions-messaging-twilio
          - functions-outbound-email
          - functions-public-website
          - functions-tenant-lifecycle
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ${{ matrix.package }}/package-lock.json
            functions-shared/package-lock.json
      - name: Build functions-shared and vendor into function packages
        working-directory: ${{ github.workspace }}
        run: |
          npm ci --prefix functions-shared
          node scripts/vendor-functions-shared.cjs
      - run: npm ci
      - run: npm run build
      - run: npm test --if-present

  firestore-rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firestore-rules-test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Verify Java 21 for Firestore emulator
        run: java -version
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firestore-rules-test/package-lock.json
      - run: npm ci
      - name: Run Firestore rules tests (requires emulator)
        working-directory: ${{ github.workspace }}
        run: npm test --prefix firestore-rules-test

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          cache: true
      - run: flutter pub get
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Flutter analyze (fails if issue count exceeds baseline)
        run: node scripts/check_flutter_analyze_ratchet.js
      - run: flutter test
