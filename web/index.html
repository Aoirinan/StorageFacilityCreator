  <!-- Lazy-load Stripe.js / PDF.js on demand (see lib/services/web_externals_loader_web.dart). -->
  <script type="text/javascript">
    (function () {
      var PDFJS_VER = '3.4.120';
      var PDFJS_BASE = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@' + PDFJS_VER + '/build/';
      window.__sfcScriptPromises = window.__sfcScriptPromises || {};
      window.sfcLoadStripeJs = function () {
        if (window.Stripe) return Promise.resolve();
        var p = window.__sfcScriptPromises.stripe;
        if (p) return p;
        p = new Promise(function (resolve, reject) {
          var s = document.createElement('script');
          s.src = 'https://js.stripe.com/v3/';
          s.async = true;
          s.onload = function () { resolve(); };
          s.onerror = function () { reject(new Error('Failed to load Stripe.js')); };
          document.head.appendChild(s);
        });
        window.__sfcScriptPromises.stripe = p;
        return p;
      };
      window.sfcLoadPdfJs = function () {
        if (window.pdfjsLib) return Promise.resolve();
        var p = window.__sfcScriptPromises.pdfjs;
        if (p) return p;
        p = new Promise(function (resolve, reject) {
          var s = document.createElement('script');
          s.src = PDFJS_BASE + 'pdf.min.js';
          s.async = true;
          s.onload = function () {
            try {
              window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + 'pdf.worker.min.js';
            } catch (e) {}
            resolve();
          };
          s.onerror = function () { reject(new Error('Failed to load PDF.js')); };
          document.head.appendChild(s);
        });
        window.__sfcScriptPromises.pdfjs = p;
        return p;
      };
    })();
  </script>

        const errorStack = event.error?.stack || '';
        
        // Suppress focus-related errors that don't break functionality
        if (errorMsg.includes('focus') || errorMsg.includes('Focus') || errorMsg.includes('js_helper') ||

          event.preventDefault();
          return true;
        }
        
        // TEMPORARILY DISABLED: App Check error suppression for debugging
        // Re-enable after fixing the root cause
        // Suppress App Check 400 errors (expected until Firebase Console is configured)
        // These are non-critical and will be fixed when secret key is configured
        /*
        if (errorMsg.includes('exchangeRecaptchaV3Token') || 
            errorMsg.includes('AppCheck') && (errorMsg.includes('400') || errorMsg.includes('Bad Request')) ||
            errorStack.includes('exchangeRecaptchaV3Token') ||
            errorStack.includes('app-check') && (errorStack.includes('400') || errorStack.includes('Bad Request'))) {
          // These errors are logged by Firebase SDK, no need to log again
          // They're expected until reCAPTCHA secret key is configured in Firebase Console
          event.preventDefault();
          return true;
        }
        */
        
        // Suppress Firestore BloomFilter errors (non-critical SDK warnings)
        // These are internal Firestore optimization warnings that don't affect functionality
        if (errorMsg.includes('BloomFilter') || errorMsg.includes('BloomFilterError') ||
            errorStack.includes('BloomFilter') || errorStack.includes('BloomFilterError')) {
          // These are Firestore SDK internal warnings - suppress to reduce console noise
          // They don't affect functionality, just query optimization warnings
          event.preventDefault();
          return true;
        }
        
        // Firestore INTERNAL ASSERTION FAILED: prevent crash; listener lifecycle handled by autoDispose
        if (errorMsg.includes('INTERNAL ASSERTION') || errorMsg.includes('Unexpected state') ||
            errorStack.includes('INTERNAL ASSERTION') || errorStack.includes('ca9')) {
          console.warn('Firestore internal state (caught):', errorMsg);
          event.preventDefault();
          return true;
        }
        
        // Suppress CSP violations from Google's reCAPTCHA (report-only violations)
        // These occur when reCAPTCHA loads and are non-blocking
        if (errorMsg.includes('Content Security Policy') && 
            (errorMsg.includes('frame-ancestors') || errorMsg.includes('google.com'))) {

          event.preventDefault();
          return true;
        }
        
        // Log other errors but don't break the app
        console.error('❌ Uncaught error:', event.error);
        return false;
      });
      
      // Catch unhandled promise rejections
      window.addEventListener('unhandledrejection', function(event) {
        const reason = event.reason?.toString() || '';
        
        // TEMPORARILY DISABLED: App Check error suppression for debugging

          event.preventDefault();
          return;

        */
        
        // Suppress Firestore BloomFilter errors in promise rejections
        if (reason.includes('BloomFilter') || reason.includes('BloomFilterError')) {
          // Non-critical Firestore SDK warning - suppress to reduce console noise
          event.preventDefault();
          return;

        // Firestore INTERNAL ASSERTION FAILED: catch so app does not crash; listener lifecycle is handled by autoDispose providers
        if (reason.includes('INTERNAL ASSERTION') || reason.includes('Unexpected state')) {
          console.warn('Firestore internal state warning (caught):', reason);

        // Suppress CSP violations from Google's reCAPTCHA (report-only violations)
        if (reason.includes('Content Security Policy') &&

          event.preventDefault();
          return;
        }
        
        console.warn('⚠️ Unhandled promise rejection:', event.reason);
        event.preventDefault();
      });
