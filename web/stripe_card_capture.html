<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Payment Method</title>
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: white;
      border-radius: 8px;
      padding: 24px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #1a1a1a;
    }
    .subtitle {
      color: #666;
      margin-bottom: 24px;
      font-size: 14px;
    }
    #card-element {
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin-bottom: 16px;
    }
    #card-errors {
      color: #dc3545;
      font-size: 14px;
      margin-bottom: 16px;
      min-height: 20px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover:not(:disabled) {
      background: #1d4ed8;
    }
    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    .loading {
      display: none;
      text-align: center;
      color: #666;
      margin-top: 16px;
    }
    .success {
      display: none;
      text-align: center;
      color: #10b981;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Add Payment Method</h1>
    <p class="subtitle">Enter your card details securely. We never see your full card number.</p>
    
    <form id="payment-form">
      <div id="card-element">
        <!-- Stripe Elements will create form elements here -->
      </div>
      <div id="card-errors" role="alert"></div>
      <button type="submit" id="submit-button">Save Card</button>
    </form>
    
    <div class="loading" id="loading">Processing...</div>
    <div class="success" id="success">✓ Payment method saved successfully!</div>
  </div>

  <script>
    // Get clientSecret from URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const clientSecret = urlParams.get('clientSecret');
    
    if (!clientSecret) {
      document.getElementById('card-errors').textContent = 'Missing client secret. Please try again.';
      document.getElementById('submit-button').disabled = true;
    } else {
      // Initialize Stripe
      // Note: In production, publishable key should come from server
      // For now, we'll get it from parent window or use a placeholder
      let publishableKey = '';
      
      // Try to get from parent window (Flutter app)
      try {
        if (window.parent && window.parent !== window) {
          publishableKey = window.parent.stripePublishableKey || '';
        }
      } catch (e) {
        // Cross-origin, can't access parent
      }
      
      // Fallback: try to get from URL parameter
      if (!publishableKey) {
        publishableKey = urlParams.get('publishableKey') || '';
      }
      
      if (!publishableKey) {
        document.getElementById('card-errors').textContent = 'Stripe publishable key not found.';
        document.getElementById('submit-button').disabled = true;
      } else {
        const stripe = Stripe(publishableKey);
        const elements = stripe.elements();
        
        const cardElement = elements.create('card', {
          style: {
            base: {
              fontSize: '16px',
              color: '#424770',
              '::placeholder': {
                color: '#aab7c4',
              },
            },
            invalid: {
              color: '#9e2146',
            },
          },
        });
        
        cardElement.mount('#card-element');
        
        cardElement.on('change', ({error}) => {
          const displayError = document.getElementById('card-errors');
          if (error) {
            displayError.textContent = error.message;
          } else {
            displayError.textContent = '';
          }
        });
        
        const form = document.getElementById('payment-form');
        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          
          const submitButton = document.getElementById('submit-button');
          const loading = document.getElementById('loading');
          const success = document.getElementById('success');
          const cardErrors = document.getElementById('card-errors');
          
          submitButton.disabled = true;
          loading.style.display = 'block';
          cardErrors.textContent = '';
          
          try {
            const {setupIntent, error} = await stripe.confirmCardSetup(clientSecret, {
              payment_method: {
                card: cardElement,
              },
            });
            
            if (error) {
              // Show error to user
              cardErrors.textContent = error.message;
              submitButton.disabled = false;
              loading.style.display = 'none';
            } else {
              // Success - send payment method ID back to parent
              loading.style.display = 'none';
              success.style.display = 'block';
              
              // Send message to parent window (Flutter app)
              const paymentMethodId = setupIntent.payment_method;
              
              try {
                if (window.parent && window.parent !== window) {
                  window.parent.postMessage({
                    type: 'STRIPE_SETUP_SUCCESS',
                    paymentMethodId: paymentMethodId,
                    setupIntentId: setupIntent.id,
                  }, '*');
                } else {
                  // Fallback: use URL callback if parent communication fails
                  const returnUrl = urlParams.get('returnUrl') || window.location.origin;
                  window.location.href = `${returnUrl}?paymentMethodId=${paymentMethodId}&setupIntentId=${setupIntent.id}`;
                }
              } catch (e) {
                console.error('Error sending message to parent:', e);
                // Fallback to URL callback
                const returnUrl = urlParams.get('returnUrl') || window.location.origin;
                window.location.href = `${returnUrl}?paymentMethodId=${paymentMethodId}&setupIntentId=${setupIntent.id}`;
              }
              
              // Close window after 2 seconds
              setTimeout(() => {
                if (window.parent && window.parent !== window) {
                  window.close();
                }
              }, 2000);
            }
          } catch (err) {
            cardErrors.textContent = 'An unexpected error occurred. Please try again.';
            submitButton.disabled = false;
            loading.style.display = 'none';
            console.error('Error:', err);
          }
        });
      }
    }
  </script>
</body>
</html>
